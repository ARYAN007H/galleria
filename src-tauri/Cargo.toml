[package]
name = "galleria_expressive"
version = "0.16.1"
description = "Photo and media viewer with Liquid Glass UI"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "galleria_expressive"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync"] }
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = "0.25"
rexif = "0.7"
base64 = "0.22"
num_cpus = "1.16"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
notify = "6"
tauri-plugin-updater = "2.0.0-beta.0"
bytemuck = "1"

# LightCraft develop engine (https://github.com/storytold/lightcraft), MIT OR Apache-2.0.
# Pinned to the local checkout at release 0.14.0 (commit 662df66f, 0.14.x); bump by pulling that repo.
# avif-serialize pinned to the exact version lightcraft's Cargo.lock builds with (0.8.6 lacks
# Aviffy::set_content_light_level, which codecs' AVIF encoder calls).
avif-serialize = "=0.8.9"
lightcraft-engine = { path = "../../lightcraft/crates/engine", default-features = false }
lightcraft-gpu = { path = "../../lightcraft/crates/gpu" }
lightcraft-pipeline = { path = "../../lightcraft/crates/pipeline" }
lightcraft-develop = { path = "../../lightcraft/crates/develop" }
lightcraft-codecs = { path = "../../lightcraft/crates/codecs" }
lightcraft-raster = { path = "../../lightcraft/crates/raster" }
lightcraft-raw = { path = "../../lightcraft/crates/raw" }
lightcraft-meta = { path = "../../lightcraft/crates/meta" }
lightcraft-catalog = { path = "../../lightcraft/crates/catalog" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The develop pipeline does per-pixel f32 work; without this `tauri dev` renders at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
debug = false
