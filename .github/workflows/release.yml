name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' 
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The develop engine is a pinned path dependency (`../../lightcraft` from
      # src-tauri). actions/checkout can't write outside the workspace, so check
      # the engine out inside it and link it to where the deps expect it.
      - name: checkout LightCraft engine (pinned)
        uses: actions/checkout@v4
        with:
          repository: storytold/lightcraft
          ref: 662df66f1c08bdb1b1f1d0c1c638c4cef936d0b0
          path: lightcraft

      - name: link engine to the path Cargo expects (posix)
        if: matrix.platform != 'windows-latest'
        run: ln -s "$GITHUB_WORKSPACE/lightcraft" "$GITHUB_WORKSPACE/../lightcraft"

      - name: link engine to the path Cargo expects (windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: New-Item -ItemType SymbolicLink -Path "$env:GITHUB_WORKSPACE\..\lightcraft" -Target "$env:GITHUB_WORKSPACE\lightcraft" | Out-Null

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Galleria Expressive v${{ github.ref_name }}'
          releaseBody: 'See the attached binaries for the release.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
